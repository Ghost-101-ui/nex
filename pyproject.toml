[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberedtnex"
version = "0.2.0"
description = "Offline, gated security-tool orchestration for authorized labs"
requires-python = ">=3.10"
authors = [{name = "CyberEDT NEX"}]
dependencies = ["questionary>=2.0", "rich>=13.0"]

[project.scripts]
nex = "nex.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
