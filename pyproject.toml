[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberedtnex"
version = "1.0.0"
description = "NEX: Offline AI Assistant for Authorized Security Training Labs"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "CyberEDT NEX"}]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
inference = [
    "llama-cpp-python>=0.2.70",
]
test = [
    "pytest>=7.0",
]

[project.scripts]
nex = "nex.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
